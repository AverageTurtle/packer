<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Packer Files</title>

    <style>
        .center {
          margin: auto;
          width: 75%;
          border: 4px solid #FFFFFF;
          border-radius: 16px;
          border-top-left-radius: 16px;
          border-top-right-radius: 16px;
          border-bottom-right-radius: 16px;
          border-bottom-left-radius: 16px;
          padding: 10px;
          text-align: center;
          color: #FFFFFF;
        }
        .background_c {
            background: #1b1a31;

            position: fixed; /* Fixed relative to the browser window */
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background-repeat: no-repeat;
            background: linear-gradient(50deg, rgb(9, 14, 29) 0%, rgb(38, 19, 59) 100%);
            z-index: -1;
        }
    </style>
</head>

<body>
<div class="background_c"></div>
<div class="center">

<h2>Manage Uploads</h2>
<p>Run /packer rezip to update the pack!</p>

<form id="asset-upload-form" name="asset-upload-form" enctype="multipart/form-data">
    <select id="asset-type" name="asset-type" onchange="renderAssets()">
        <option value="">-- Select Type --</option>
        <option value="item-definition">Item Definition (.json)</option>
        <option value="model">Model (.json)</option>
        <option value="texture">Texture (.png)</option>
    </select>
    <input type="file" id="asset-file" name="asset-file">
    <input type="submit", value="Upload">
</form>

<br>
<ul id="asset-list"></ul>

</div>
</body>

<script>
    //upload
    document.getElementById('asset-upload-form').addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData(this)

        if (!formData.get('asset-type') || formData.get('asset-file').size === 0) {
            alert("Please select a type and a file.");
            return;
        }

        fetch('/api/upload', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (response.ok) {
                renderAssets();
                alert("Upload Successful!");
            } else {
                return response.text().then(text => { throw new Error(text) });
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert("Upload failed: " + error.message);
        });
        
    });

    // Manage files
    function renderAssets() {
        const asset_type = document.getElementById('asset-type').value;
        fetch("/api/get/"+asset_type+"s").then(response => response.json()).then(data => {
            let list = document.getElementById("asset-list");
            list.innerHTML = "";
            
            data.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.name;

                const delete_button = document.createElement('button');
                delete_button.textContent = 'Delete';
                delete_button.style.marginLeft = "10px";
                
                delete_button.onclick = () => deleteAsset(item.name, asset_type);
                
                li.appendChild(delete_button);

                list.appendChild(li);
            });

        }).catch(error => {
            let list = document.getElementById("asset-list");
            list.innerHTML = "";
        })
    }

    function deleteAsset(name, type) {
        if (confirm("Are you sure you want to delete this item?")) {
            fetch(`/api/delete`, { 
                method: 'POST', 
                body: JSON.stringify({
                    "name": name,
                    "type": type
                }),
                headers: {
                    "Content-type": "application/json; charset=UTF-8"
                }   
            })
            .then(response => {
                if (response.ok) {
                    renderAssets();
                } else {
                    alert("Failed to delete item.");
                }
            })
            .catch(error => console.error('Error:', error));
        }
    }

</script>>

</html>
